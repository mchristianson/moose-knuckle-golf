name: MooseKnuckleGolf
options:
  bundleIdPrefix: com.mooseknucklegolf
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.24.0

targets:
  MooseKnuckleGolf:
    type: application
    platform: iOS
    sources:
      - path: MooseKnuckleGolf
    info:
      path: MooseKnuckleGolf/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Moose Knuckle Golf
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - mooseknucklegolf
        UIAppFonts:
          - Anton-Regular.ttf
          - JetBrainsMono-Variable.ttf
          - Barlow-Regular.ttf
          - Barlow-SemiBold.ttf
          - Barlow-Bold.ttf
          - Barlow-ExtraBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mooseknucklegolf.ios
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Supabase
        product: Supabase
